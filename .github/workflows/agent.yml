name: orcanium-agent

on:
  push:
    branches: [main]
  pull_request:

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and development tools
        run: python -m pip install --upgrade pip && pip install -e 'orcanium[dev]'
      - name: Run standalone release gate
        run: python scripts/release_gate.py
      - name: Run focused architecture tests
        run: python -m pytest -q tests/test_runtime_turn.py tests/test_agent_registry.py tests/test_agent_factory.py
