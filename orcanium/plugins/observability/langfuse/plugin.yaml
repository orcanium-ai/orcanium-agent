name: langfuse
version: "1.0.0"
description: "Optional Langfuse observability for Orcanium — traces conversations, LLM calls, and tool usage. Opt-in via `orcanium plugins enable observability/langfuse` or `orcanium tools → Langfuse Observability`."
author: Orcanium
requires_env:
  - ORCANIUM_LANGFUSE_PUBLIC_KEY
  - ORCANIUM_LANGFUSE_SECRET_KEY
hooks:
  - pre_api_request
  - post_api_request
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
